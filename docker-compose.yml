version: '3.8'

services:
  database:
    image: postgis/postgis:15-3.3
    container_name: thermotrace-database
    environment:
      POSTGRES_DB: thermotrace_db
      POSTGRES_USER: thermotrace
      POSTGRES_PASSWORD: thermotrace_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U thermotrace -d thermotrace_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: thermotrace-backend
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://thermotrace:thermotrace_pass@database:5432/thermotrace_db
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
