services:
  - type: web
    name: thermotrace-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /app:/app/services/temporal_intelligence:/app/services/classification
      - key: PORT
        value: 8000
